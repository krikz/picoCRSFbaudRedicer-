; PlatformIO: прошивка преобразователя скорости CRSF для RP2040 (Raspberry Pi Pico).
;
;   pio run -e rp2040_crsf_baud_reducer           # сборка
;   pio run -e rp2040_crsf_baud_reducer -t upload # прошивка (picotool)
;   pio test -e native_test                       # нативные тесты логики моста
;
; Стиль и каркас — по проекту GOODWORKRINKZ/biba.

[platformio]
default_envs = rp2040_crsf_baud_reducer

[common]
build_src_filter =
    +<*>
    -<main.cpp>
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Wpedantic
    -Iinclude
    -Isrc

[target_rp2040_crsf_baud_reducer]
board = rpipico
target_include = targets/RP2040_CRSF_BAUD_REDUCER

[env:rp2040_crsf_baud_reducer]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
; board = rpipico, не pico: в этом форке platform-raspberrypi два board id
; тянут разные прошивки Arduino (pico → framework-arduino-mbed).
board = ${target_rp2040_crsf_baud_reducer.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = +<*>
build_flags =
    ${common.build_flags}
    -I${target_rp2040_crsf_baud_reducer.target_include}

[env:native_test]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.0
; test_support — папка с хелперами, а не набор тестов: без этого PlatformIO
; пытается собрать её как тест и падает с "Nothing to build".
test_ignore = test_support
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags}
    -Wpedantic
    -Itest/test_support
test_build_src = yes
